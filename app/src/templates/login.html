{% extends "base.html" %}

{% block layout %}
<div class="login-shell">
  <div class="login-card">

    <!-- ロゴ -->
    <div class="login-logo">
      <img src="{{ url_for('static', path='logo_3.png') }}" alt="ここサポ">
      <img src="{{ url_for('static', path='logo_2.png') }}" alt="" onerror="this.style.display='none'" style="height:28px;width:auto">
    </div>

    <div style="text-align:center">
      <h1 style="font-size:1.2rem;font-weight:700;color:var(--color-text);margin-bottom:0.25rem">ログイン / 新規登録</h1>
      <p style="font-size:0.82rem;color:var(--color-text-mid)">ここサポへようこそ。まずはログインしてください。</p>
    </div>

    <!-- Google ログイン -->
    <a href="/login/google" class="btn-google" style="width:100%">
      <svg style="width:18px;height:18px" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M44.5 20H24V28.5H35.5C34.7 32.2 32.2 35.3 28.5 37.3V43.5C37.5 41.5 44.5 33.7 44.5 24C44.5 22.7 44.3 21.3 44 20H44.5Z" fill="#4285F4"/>
        <path d="M24 44.5C30.3 44.5 35.6 42.4 39.5 38.6L33.7 33.5C30.4 35.6 27.2 37.1 24 37.1C18.6 37.1 14 33.7 12.3 28.9H5.8V35.3C9.4 40.5 16.2 44.5 24 44.5Z" fill="#34A853"/>
        <path d="M12.3 28.9C11.9 27.6 11.7 26.3 11.7 25C11.7 23.7 11.9 22.4 12.3 21.1V14.7H5.8C4.5 17.3 3.8 20.1 3.8 23C3.8 25.9 4.5 28.7 5.8 31.3L12.3 28.9Z" fill="#FBBC05"/>
        <path d="M24 10.9C27.4 10.9 30.6 12.3 33 14.7L39.5 8.2C35.6 4.4 30.3 2.5 24 2.5C16.2 2.5 9.4 6.5 5.8 11.7L12.3 14.7C14 9.9 18.6 6.5 24 6.5V10.9Z" fill="#EA4335"/>
      </svg>
      Googleでログイン
    </a>

    <div class="divider">またはIDとパスワードで</div>

    <!-- ID/パスワードログイン -->
    <form method="post" action="/login" class="login-form">
      <div class="form-group">
        <label class="form-label">表示名</label>
        <input name="name" required class="form-input" placeholder="例: tanaka">
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input name="password" type="password" required class="form-input" placeholder="パスワードを入力">
      </div>
      <div class="form-group">
        <label class="form-label">役割</label>
        <select name="role" class="form-input">
          <option value="student">学生</option>
          <option value="teacher">教員</option>
        </select>
      </div>
      {% if error %}
      <p style="font-size:0.82rem;color:#ef4444">{{ error }}</p>
      {% endif %}
      <button type="submit" class="btn-primary">ログイン / 登録</button>
    </form>

  </div>
</div>
{% endblock %}
